<form [formGroup]="loginForm" (submit)="login()">
    <h2 class="text-3xl leading-9">Login to your account</h2>
    <div class="flex gap-6 flex-col mt-8">
        <app-input formControlName="email" [type]="'email'" [placeholder]="'Email'"></app-input>
        <app-input formControlName="password" [type]="'password'" [placeholder]="'Password'"></app-input>
    </div>
    <div class="flex justify-between mt-6">
        <div class="flex items-center gap-2 text-[#313131]">
            <input id="remindMe" type="checkbox" value="" class="w-4 h-4 border-[#313131]">
            <label for="remindMe" class="">Remind me</label>
        </div>
        <h5
            class="text-[var(--main-color)] font-semibold text-sm leading-5 tracking-normal underline decoration-solid underline-offset-2">
            Forgot Password</h5>
    </div>
    <h3 class="text-[#313131] tracking-normal text-center mt-6 leading-5 font-normal">No account? <span
            class="font-semibold text-[var(--main-color)] text-sm underline  decoration-solid underline-offset-2">Create
            one here</span></h3>
    <button class="mt-6 text-white py-3 rounded-[30px] w-full bg-[var(--main-color)] ">Login</button>
</form>
